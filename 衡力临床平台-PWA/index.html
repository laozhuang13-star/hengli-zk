<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="衡力临床智库">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/favicon-32.png">
  <title>衡力临床智库</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #ffffff, #ffffff);
      color: #243447; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .launch { text-align: center; padding: 28px; }
    .mark {
      width: 86px; height: 86px; margin: 0 auto 18px; border-radius: 22px;
      border: 1px solid #e5e7eb; display: grid; place-items: center;
      color: #243447; font-size: 36px; font-weight: 700; letter-spacing: 1px;
      box-shadow: 0 10px 35px rgba(0,0,0,.22);
    }
    .name { font-size: 19px; font-weight: 650; letter-spacing: 1px; }
    .hint { margin-top: 10px; color: #64748b; font-size: 13px; }
    .dot { display:inline-block; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }
  </style>
</head>
<body>
  <main class="launch">
    <div class="mark"><img src="./icons/icon-192.png" alt="衡力临床智库" style="width:100%;height:100%;object-fit:cover;border-radius:22px"></div>
    <div class="name">衡力临床智库</div>
    <div class="hint">正在进入系统<span class="dot">…</span></div>
  </main>
  <script>
    const TARGET_URL = "https://pro-hengli.base44.app/";
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
    setTimeout(() => window.location.replace(TARGET_URL), 700);
  </script>
</body>
</html>
